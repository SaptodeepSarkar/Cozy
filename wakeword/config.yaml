# ---------------------------------------------------------------------------
# Cozy wake-word configuration
# ---------------------------------------------------------------------------

wake_word:
  text: "hey cozy"
  # Alternate spellings nudge the TTS into varied pronunciations/accents
  # ("cosy" is simply the British spelling of cozy).
  phonetic_variants: ["hey cozy", "hey cosy", "hey kozie", "hey Cozy."]

similar_words:
  # Hard negatives: acoustically close to "hey cozy" but MUST NOT trigger.
  # Phrase-matched lookalikes plus bare words that share the tail.
  - hey rosy
  - hey nosy
  - hey Josie
  - hey Ozzie
  - hey dozy
  - hey posy
  - hey noisy
  - rosy
  - nosy
  - noisy
  - Josie
  - Ozzie
  - dozy
  - posy

audio:
  sample_rate: 16000
  clip_seconds: 2.0

counts:                  # used by generate_data.py --mode full
  positive: 6000         # synthetic "hey cozy" clips
  extra_positive: 2500   # synthetic BARE "cozy" clips (wake works either way)
  similar_per_word: 800  # per similar word
  random_negative: 6000  # everyday speech that must never trigger
seed_copy: 10            # demo clips copied into data/cozy and data/similar

# Bare wake word: also train on plain "cozy" so a short call works too
extra_positive_phrases:
  - cozy
  - cosy

piper:
  multispeaker_generator: true  # use LibriTTS-R generator when downloaded
  max_speakers: 48              # distinct voices mixed per run
  batch_size: 24                # safe for 6 GB GPUs; drop to 8-16 on CPU

training:
  window_frames: 16       # embedding frames per detection window
  stride_frames: 8
  augment_copies: 2       # clean + N augmented feature passes per clip
  batch_size: 256
  epochs: 12
  learning_rate: 0.0005
  weight_decay: 0.0001
  val_fraction: 0.1       # fraction of CLIPS held out for validation
  max_windows_per_clip: 8

model:
  name: cozy_v1
  threshold: 0.5
