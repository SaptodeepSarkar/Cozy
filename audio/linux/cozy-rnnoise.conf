# User-local PipeWire source: physical internal mic -> RNNoise -> virtual mic.
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Cozy Noise-Canceling source"
            media.name = "Cozy Noise-Canceling source"
            filter.graph = {
                nodes = [
                    {
                        type = ladspa
                        name = rnnoise
                        plugin = "librnnoise_ladspa"
                        label = "noise_suppressor_mono"
                        control = { "VAD Threshold (%)" = 50.0 }
                    }
                ]
            }
            capture.props = {
                node.name = "effect_input.cozy-rnnoise"
                node.passive = true
                target.object = "alsa_input.pci-0000_00_1f.3.analog-stereo"
                audio.channels = 1
                audio.position = [ MONO ]
            }
            playback.props = {
                node.name = "effect_output.cozy-rnnoise"
                media.class = "Audio/Source"
                audio.channels = 1
                audio.position = [ MONO ]
            }
        }
    }
]
