[project]
name = "cozy-vision"
version = "0.1.0"
description = "Local desktop GUI agent for Cozy: planner VLM + fast VLA on Pop!_OS"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  # ML stack
  "torch>=2.4",
  "transformers>=4.46",
  "accelerate>=1.0",
  "qwen-vl-utils>=0.0.10",
  "bitsandbytes>=0.43",
  "autoawq>=0.2.7",          # AWQ int4 for Qwen2.5-VL
  "peft>=0.13",              # LoRA SFT
  "trl>=0.12",               # SFT trainer
  "huggingface-hub>=0.26",
  "safetensors>=0.4",
  # Vision / screen
  "pillow>=10",
  "opencv-python>=4.10",
  # Pop!_OS / Wayland input + screen
  "python-xlib>=0.33",       # X11 fallback
  # data + utils
  "pyyaml>=6",
  "pydantic>=2",
  "tyro>=0.8",
  "requests>=2.32",
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
cozy-vision = "harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness"]
